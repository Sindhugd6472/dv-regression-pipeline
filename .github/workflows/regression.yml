name: EDA Regression Automation

on:
  push:
    branches: [ main, eda-tooling-refresh ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python_quality:
    name: Python Tooling Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate regression configuration
        run: python tools/run_regression.py --list

  rtl_regression:
    name: RTL Regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        design: [fifo, counter]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run configured regression job
        run: python tools/run_regression.py --job ${{ matrix.design }}

      - name: Parse regression results
        run: |
          python coverage/parse_coverage.py             sim/${{ matrix.design }}_results.log             --design ${{ matrix.design }}             --output coverage/${{ matrix.design }}_report.json             --fail-on-test-failure

      - name: Upload structured regression report
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.design }}
          path: coverage/${{ matrix.design }}_report.json
